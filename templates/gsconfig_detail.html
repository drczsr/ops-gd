{{ template "head" . }}
<a href="/gsconfig" class="btn btn-sm btn-outline-secondary mb-3">← 返回列表</a>
<h4 class="mb-3">编辑服 {{ index .Row "Id" }}</h4>
<div class="card wo-card" style="max-width:820px;">
  <div class="card-body">
    <form method="post" action="/gsconfig/{{ index .Row "Id" }}">
      {{ range $c := .Cols }}
      <div class="mb-2 row">
        <label class="col-sm-4 col-form-label">{{ $c.Name }} <span class="text-muted small">{{ $c.GameType }}</span></label>
        <div class="col-sm-8">
          <input class="form-control form-control-sm" name="{{ $c.Name }}" value="{{ index $.Row $c.Name }}"
            {{ if eq $c.Name "Id" }}readonly{{ end }}>
        </div>
      </div>
      {{ end }}
      <button class="btn btn-primary mt-2">保存</button>
    </form>
  </div>
</div>
{{ template "foot" . }}
